<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="50mm"
  height="30mm"
  viewBox="0 0 500 300"
  data-template="etiqueta_chaves_BASE_50x30"
  data-dpi-reference="203"
  data-bitmap-reference="384x240">
  <!--
    Arte fixa da etiqueta de chaves Niimbot 50×30 mm (duas faces 25×30).
    - modelo/cor: faixa preta, texto branco
    - cliente: coluna branca ampliada
    - placa: moldura menor, mais perto da borda da face
    Textos rotacionados -90°. Preencher só via textContent.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .chave-field {
        fill: #000000;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .chave-field-on-black {
        fill: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .chave-brasil {
        fill: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        font-size: 9px;
        letter-spacing: 0.4px;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="500" height="300" fill="#ffffff"/>
  <rect x="6" y="8" width="488" height="284" rx="14" ry="14"
    fill="none" stroke="#000000" stroke-width="4"/>
  <line x1="250" y1="10" x2="250" y2="290" stroke="#000000" stroke-width="2"/>

  <!-- FACE 1 -->
  <g id="art-face-1">
    <rect id="faixa-preta-1" x="12" y="14" width="102" height="272" rx="12" ry="12" fill="#000000"/>
    <!-- Coluna do cliente ampliada -->
    <line x1="122" y1="28" x2="122" y2="272" stroke="#000000" stroke-width="2"/>
    <line x1="176" y1="28" x2="176" y2="272" stroke="#000000" stroke-width="2"/>
    <!-- Placa mais perto da borda da face (dobra) -->
    <rect x="184" y="48" width="58" height="208" rx="8" ry="8"
      fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="188" y="54" width="12" height="196" rx="2" ry="2" fill="#000000"/>
    <circle cx="194" cy="66" r="2.4" fill="#ffffff"/>
    <circle cx="194" cy="238" r="2.4" fill="#ffffff"/>
    <text class="chave-brasil" transform="rotate(-90 194 152)" x="194" y="152">BRASIL</text>
  </g>

  <!-- FACE 2 -->
  <g id="art-face-2">
    <rect id="faixa-preta-2" x="262" y="14" width="102" height="272" rx="12" ry="12" fill="#000000"/>
    <line x1="372" y1="28" x2="372" y2="272" stroke="#000000" stroke-width="2"/>
    <line x1="426" y1="28" x2="426" y2="272" stroke="#000000" stroke-width="2"/>
    <rect x="434" y="48" width="58" height="208" rx="8" ry="8"
      fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="438" y="54" width="12" height="196" rx="2" ry="2" fill="#000000"/>
    <circle cx="444" cy="66" r="2.4" fill="#ffffff"/>
    <circle cx="444" cy="238" r="2.4" fill="#ffffff"/>
    <text class="chave-brasil" transform="rotate(-90 444 152)" x="444" y="152">BRASIL</text>
  </g>

  <!-- Campos face 1 -->
  <g id="fields-face-1">
    <text id="modelo-1" data-field="modelo"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="30" text-anchor="middle" data-max-width="248" x="42" y="150" transform="rotate(-90 42 150)">WRANGLER</text>
    <text id="cor-1" data-field="cor"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="22" text-anchor="middle" data-max-width="236" x="74" y="150" transform="rotate(-90 74 150)">BRANCA</text>
    <text id="cliente-1" data-field="cliente"
      class="chave-field" fill="#000000" font-size="16" text-anchor="middle" data-max-width="248" x="149" y="150" transform="rotate(-90 149 150)">Cliente: MECÂNICA LÍDER</text>
    <text id="placa-1" data-field="placa"
      class="chave-field" fill="#000000" font-size="18" text-anchor="middle" data-max-width="140" x="222" y="152" transform="rotate(-90 222 152)">JAW1941</text>
  </g>

  <!-- Campos face 2 -->
  <g id="fields-face-2">
    <text id="modelo-2" data-field="modelo"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="30" text-anchor="middle" data-max-width="248" x="292" y="150" transform="rotate(-90 292 150)">WRANGLER</text>
    <text id="cor-2" data-field="cor"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="22" text-anchor="middle" data-max-width="236" x="324" y="150" transform="rotate(-90 324 150)">BRANCA</text>
    <text id="cliente-2" data-field="cliente"
      class="chave-field" fill="#000000" font-size="16" text-anchor="middle" data-max-width="248" x="399" y="150" transform="rotate(-90 399 150)">Cliente: MECÂNICA LÍDER</text>
    <text id="placa-2" data-field="placa"
      class="chave-field" fill="#000000" font-size="18" text-anchor="middle" data-max-width="140" x="472" y="152" transform="rotate(-90 472 152)">JAW1941</text>
  </g>
</svg>
