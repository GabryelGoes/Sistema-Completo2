<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="50mm"
  height="30mm"
  viewBox="0 0 500 300"
  data-template="etiqueta_chaves_BASE_50x30"
  data-dpi-reference="203"
  data-bitmap-reference="384x240">
  <!--
    Arte fixa da etiqueta de chaves Niimbot 50×30 mm (duas faces 25×30).
    - modelo/cor: faixa preta ampliada, texto branco
    - cliente: coluna branca entre faixa e placa
    - placa: moldura Mercosul menor para dar destaque ao veículo
    Textos rotacionados -90°. Preencher só via textContent.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .chave-field {
        fill: #000000;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .chave-field-on-black {
        fill: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .chave-brasil {
        fill: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        font-size: 9px;
        letter-spacing: 0.4px;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="500" height="300" fill="#ffffff"/>
  <rect x="6" y="8" width="488" height="284" rx="14" ry="14"
    fill="none" stroke="#000000" stroke-width="4"/>
  <line x1="250" y1="10" x2="250" y2="290" stroke="#000000" stroke-width="2"/>

  <!-- FACE 1 -->
  <g id="art-face-1">
    <!-- Faixa preta ampliada: modelo + cor -->
    <rect id="faixa-preta-1" x="12" y="14" width="102" height="272" rx="12" ry="12" fill="#000000"/>
    <!-- Separadores da coluna do cliente -->
    <line x1="124" y1="28" x2="124" y2="272" stroke="#000000" stroke-width="2"/>
    <line x1="152" y1="28" x2="152" y2="272" stroke="#000000" stroke-width="2"/>
    <!-- Moldura da placa (menor) -->
    <rect x="160" y="40" width="68" height="220" rx="9" ry="9"
      fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="164" y="46" width="14" height="208" rx="2.5" ry="2.5" fill="#000000"/>
    <circle cx="171" cy="58" r="2.6" fill="#ffffff"/>
    <circle cx="171" cy="236" r="2.6" fill="#ffffff"/>
    <text class="chave-brasil" transform="rotate(-90 171 150)" x="171" y="150">BRASIL</text>
  </g>

  <!-- FACE 2 -->
  <g id="art-face-2">
    <rect id="faixa-preta-2" x="262" y="14" width="102" height="272" rx="12" ry="12" fill="#000000"/>
    <line x1="374" y1="28" x2="374" y2="272" stroke="#000000" stroke-width="2"/>
    <line x1="402" y1="28" x2="402" y2="272" stroke="#000000" stroke-width="2"/>
    <rect x="410" y="40" width="68" height="220" rx="9" ry="9"
      fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="414" y="46" width="14" height="208" rx="2.5" ry="2.5" fill="#000000"/>
    <circle cx="421" cy="58" r="2.6" fill="#ffffff"/>
    <circle cx="421" cy="236" r="2.6" fill="#ffffff"/>
    <text class="chave-brasil" transform="rotate(-90 421 150)" x="421" y="150">BRASIL</text>
  </g>

  <!-- Campos face 1 -->
  <g id="fields-face-1">
    <text id="modelo-1" data-field="modelo"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="30" text-anchor="middle" data-max-width="248" x="42" y="150" transform="rotate(-90 42 150)">WRANGLER</text>
    <text id="cor-1" data-field="cor"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="22" text-anchor="middle" data-max-width="236" x="74" y="150" transform="rotate(-90 74 150)">BRANCA</text>
    <text id="cliente-1" data-field="cliente"
      class="chave-field" fill="#000000" font-size="15" text-anchor="middle" data-max-width="248" x="138" y="150" transform="rotate(-90 138 150)">Cliente: MECÂNICA LÍDER</text>
    <text id="placa-1" data-field="placa"
      class="chave-field" fill="#000000" font-size="20" text-anchor="middle" data-max-width="150" x="206" y="150" transform="rotate(-90 206 150)">JAW1941</text>
  </g>

  <!-- Campos face 2 -->
  <g id="fields-face-2">
    <text id="modelo-2" data-field="modelo"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="30" text-anchor="middle" data-max-width="248" x="292" y="150" transform="rotate(-90 292 150)">WRANGLER</text>
    <text id="cor-2" data-field="cor"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="22" text-anchor="middle" data-max-width="236" x="324" y="150" transform="rotate(-90 324 150)">BRANCA</text>
    <text id="cliente-2" data-field="cliente"
      class="chave-field" fill="#000000" font-size="15" text-anchor="middle" data-max-width="248" x="388" y="150" transform="rotate(-90 388 150)">Cliente: MECÂNICA LÍDER</text>
    <text id="placa-2" data-field="placa"
      class="chave-field" fill="#000000" font-size="20" text-anchor="middle" data-max-width="150" x="456" y="150" transform="rotate(-90 456 150)">JAW1941</text>
  </g>
</svg>
