<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>REI DO ABS</title>
    
    <!-- PWA Configs -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REI DO ABS" />
    
    <!-- Fonte próxima ao estilo tipográfico de placa Mercosul (condensada / técnica) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Novo Ícone -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              /** UI: mesmo núcleo que iOS/macOS (San Francisco via sistema) + fallbacks Windows/Android */
              sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              /** Nome do veículo nos cards/modais — mantém visual anterior (Helvetica), fora da UI SF */
              vehicle: ['"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
              /** Miniatura de placa Mercosul nos cards — Barlow Condensed próximo ao visual de placagem */
              plate: ['"Barlow Condensed"', '"Arial Narrow"', 'Arial', 'sans-serif'],
            },
            colors: {
              brand: {
                /** Controlado por --app-accent-rgb (Configurações → Aparência) */
                yellow: 'rgb(var(--app-accent-rgb) / <alpha-value>)',
                dark: '#0A0A0A',
                surface: '#121212',
                surfaceHighlight: '#1C1C1E',
                border: '#2C2C2E',
              },
              light: {
                page: '#f2f2f7',
                card: '#e8e8ed',
                elevated: '#ffffff',
                border: '#d1d1d6',
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --app-accent: #F5D00B;
        --app-accent-rgb: 245 208 11;
        --app-accent-hover: #fcd61e;
      }
      body {
        background-color: #f2f2f7;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none; /* Previne pull-to-refresh nativo no mobile */
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dark body {
        background-color: #000000;
        color: #ffffff;
      }
      
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e5e5ea; 
      }
      .dark ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #c7c7cc; 
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #333; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #aeaeb2; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }

      /* Modais — estilo iOS 17 (backdrop + sheet) */
      @keyframes modal-backdrop-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes modal-sheet-in {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(24px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .animate-modal-backdrop {
        animation: modal-backdrop-in 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      }
      .animate-modal-sheet {
        animation: modal-sheet-in 0.42s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      }

      /* Efeito "abrindo app" (inspirado no Windows Phone) para modais de carro do Patio */
      @keyframes modal-wp-app-in {
        from {
          opacity: 0;
          transform: perspective(1200px) translateY(36px) scale(0.82) rotateX(-10deg);
          filter: saturate(0.85) blur(1px);
        }
        to {
          opacity: 1;
          transform: perspective(1200px) translateY(0) scale(1) rotateX(0deg);
          filter: saturate(1) blur(0);
        }
      }
      .animate-modal-wp-app {
        transform-origin: center 86%;
        animation: modal-wp-app-in 0.48s cubic-bezier(0.2, 0.85, 0.22, 1) both;
        will-change: transform, opacity, filter;
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-modal-wp-app {
          animation: modal-sheet-in 0.2s ease-out both;
          filter: none;
        }
      }

      /* Modo cinematográfico: embaça placas para gravação de tela / redes sociais */
      .blur-plate {
        filter: blur(8px);
        -webkit-filter: blur(8px);
        user-select: none;
        display: inline-block;
        min-width: 2ch;
        letter-spacing: 0.1em;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
