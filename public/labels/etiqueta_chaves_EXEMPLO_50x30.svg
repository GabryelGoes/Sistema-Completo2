<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="50mm"
  height="30mm"
  viewBox="0 0 500 300"
  data-template="etiqueta_chaves_BASE_50x30"
  data-dpi-reference="203"
  data-bitmap-reference="384x240">
  <!--
    Arte fixa da etiqueta de chaves Niimbot 50×30 mm (duas faces 25×30).
    - modelo/cor: faixa preta, texto branco
    - cliente: coluna branca sem linhas de divisão
    - placa: moldura ainda menor, perto da borda da face
    Textos rotacionados -90°. Preencher só via textContent.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .chave-field {
        fill: #000000;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .chave-field-on-black {
        fill: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .chave-brasil {
        fill: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        font-size: 8px;
        letter-spacing: 0.3px;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="500" height="300" fill="#ffffff"/>
  <rect x="6" y="8" width="488" height="284" rx="14" ry="14"
    fill="none" stroke="#000000" stroke-width="4"/>
  <line x1="250" y1="10" x2="250" y2="290" stroke="#000000" stroke-width="2"/>

  <!-- FACE 1 -->
  <g id="art-face-1">
    <rect id="faixa-preta-1" x="12" y="14" width="102" height="272" rx="12" ry="12" fill="#000000"/>
    <!-- Placa menor, mais perto da borda da face (dobra) -->
    <rect x="192" y="56" width="50" height="192" rx="7" ry="7"
      fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="195" y="61" width="11" height="182" rx="2" ry="2" fill="#000000"/>
    <circle cx="200.5" cy="72" r="2.2" fill="#ffffff"/>
    <circle cx="200.5" cy="232" r="2.2" fill="#ffffff"/>
    <text class="chave-brasil" transform="rotate(-90 200.5 152)" x="200.5" y="152">BRASIL</text>
  </g>

  <!-- FACE 2 -->
  <g id="art-face-2">
    <rect id="faixa-preta-2" x="262" y="14" width="102" height="272" rx="12" ry="12" fill="#000000"/>
    <rect x="442" y="56" width="50" height="192" rx="7" ry="7"
      fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <rect x="445" y="61" width="11" height="182" rx="2" ry="2" fill="#000000"/>
    <circle cx="450.5" cy="72" r="2.2" fill="#ffffff"/>
    <circle cx="450.5" cy="232" r="2.2" fill="#ffffff"/>
    <text class="chave-brasil" transform="rotate(-90 450.5 152)" x="450.5" y="152">BRASIL</text>
  </g>

  <!-- Campos face 1 -->
  <g id="fields-face-1">
    <text id="modelo-1" data-field="modelo"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="30" text-anchor="middle" data-max-width="248" x="42" y="150" transform="rotate(-90 42 150)">WRANGLER</text>
    <text id="cor-1" data-field="cor"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="22" text-anchor="middle" data-max-width="236" x="74" y="150" transform="rotate(-90 74 150)">BRANCA</text>
    <text id="cliente-1" data-field="cliente"
      class="chave-field" fill="#000000" font-size="16" text-anchor="middle" data-max-width="248" x="153" y="150" transform="rotate(-90 153 150)">Cliente: MECÂNICA LÍDER</text>
    <text id="placa-1" data-field="placa"
      class="chave-field" fill="#000000" font-size="17" text-anchor="middle" data-max-width="124" x="226" y="152" transform="rotate(-90 226 152)">JAW1941</text>
  </g>

  <!-- Campos face 2 -->
  <g id="fields-face-2">
    <text id="modelo-2" data-field="modelo"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="30" text-anchor="middle" data-max-width="248" x="292" y="150" transform="rotate(-90 292 150)">WRANGLER</text>
    <text id="cor-2" data-field="cor"
      data-on-black="1" class="chave-field-on-black" fill="#ffffff" font-size="22" text-anchor="middle" data-max-width="236" x="324" y="150" transform="rotate(-90 324 150)">BRANCA</text>
    <text id="cliente-2" data-field="cliente"
      class="chave-field" fill="#000000" font-size="16" text-anchor="middle" data-max-width="248" x="403" y="150" transform="rotate(-90 403 150)">Cliente: MECÂNICA LÍDER</text>
    <text id="placa-2" data-field="placa"
      class="chave-field" fill="#000000" font-size="17" text-anchor="middle" data-max-width="124" x="476" y="152" transform="rotate(-90 476 152)">JAW1941</text>
  </g>
</svg>
